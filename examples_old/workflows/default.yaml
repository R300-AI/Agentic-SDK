version: "1"
entry: perceive
nodes:
  perceive:
    type: builtin.perceive
  plan:
    type: builtin.plan
  retrieve:
    type: builtin.retrieve
  reflect:
    type: builtin.reflect
    params:
      on_failure: retry_plan
  action:
    type: completion
    params:
      backend: foundry
gates:
  max_node_hops: 20
  max_revisit: 3
  timeout_sec: 30
