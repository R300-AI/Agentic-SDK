# 此 workflow 已合併至 deploy-gateway.yml（三段 pipeline：gateway → build → pages）
# 僅保留做為緊急手動觸發備用；Gateway URL 固定（Azure App Service），不需 secret。
name: Deploy Pages Only (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build Vite app
        env:
          VITE_BASE: /Agentic-SDK/
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
