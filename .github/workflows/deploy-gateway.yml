name: Deploy Gateway + GitHub Pages

# 所有部署參數來自 GitHub Repository Variables，設定步驟見 docs/github_cicd_workflow.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # OIDC 登入 Azure 必要

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure 登入（OIDC，無 secret）
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 佈建 Azure 資源（冪等，已存在則略過）
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            RG="${{ vars.AZURE_RESOURCE_GROUP }}"
            WEBAPP="${{ vars.AZURE_WEBAPP_NAME }}"
            KV="${{ vars.KEY_VAULT_NAME }}"
            REGION="${{ vars.AZURE_REGION }}"
            PLAN="${WEBAPP}-plan"

            # Resource Group
            echo "▶ [1/6] Resource Group: $RG"
            if az group show --name "$RG" --output none 2>/dev/null; then
              echo "  ✔ 已存在，略過建立"
            else
              az group create --name "$RG" --location "$REGION" --output none
              echo "  ✔ 已建立"
            fi

            # App Service Plan
            echo "▶ [2/6] App Service Plan: $PLAN (B2 Linux)"
            if az appservice plan show --name "$PLAN" --resource-group "$RG" --output none 2>/dev/null; then
              echo "  ✔ 已存在，略過建立"
            else
              az appservice plan create \
                --name "$PLAN" --resource-group "$RG" \
                --sku B2 --is-linux --location "$REGION" \
                --output none
              echo "  ✔ 已建立"
            fi

            # App Service
            echo "▶ [3/6] App Service: $WEBAPP"
            if az webapp show --name "$WEBAPP" --resource-group "$RG" --output none 2>/dev/null; then
              echo "  ✔ 已存在，將於後續步驟更新程式碼與設定"
            else
              az webapp create \
                --name "$WEBAPP" --resource-group "$RG" \
                --plan "$PLAN" --runtime "PYTHON:3.12" \
                --output none
              echo "  ✔ 已建立"
            fi

            # Managed Identity
            echo "▶ [4/6] Managed Identity: $WEBAPP"
            az webapp identity assign \
              --name "$WEBAPP" --resource-group "$RG" \
              --output none
            echo "  ✔ 已確認啟用"

            # Key Vault
            echo "▶ [5/6] Key Vault: $KV"
            if az keyvault show --name "$KV" --output none 2>/dev/null; then
              echo "  ✔ 已存在，略過建立"
            else
              az keyvault create \
                --name "$KV" --resource-group "$RG" \
                --location "$REGION" --sku standard \
                --enable-rbac-authorization true \
                --output none
              echo "  ✔ 已建立"
            fi

            # Key Vault Role Assignment
            echo "▶ [6/6] Key Vault 角色授權：Key Vault Secrets User → $WEBAPP Managed Identity"
            PRINCIPAL_ID=$(az webapp identity show \
              --name "$WEBAPP" --resource-group "$RG" \
              --query principalId -o tsv)
            KV_ID=$(az keyvault show --name "$KV" --query id -o tsv)
            az role assignment create \
              --role "Key Vault Secrets User" \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --scope "$KV_ID" \
              --output none 2>/dev/null || true
            echo "  ✔ 已確認授權"
            echo ""
            echo "✅ 所有 Azure 資源佈建完成"

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 產生 requirements.txt（鎖定版本）
        run: |
          pip install uv --quiet
          uv pip compile pyproject.toml -o requirements.txt

      - name: 部署至 Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: 設定 App Service 啟動指令與基礎參數
        # 敏感資料（Foundry key/endpoint）由 App Service Managed Identity
        # 從 Key Vault（agentic-sdk-models）在 runtime 讀取。
        # 此步驟只設定非敏感的執行環境參數。
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --name ${{ vars.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --startup-file "python -m agentic_sdk.gateway"

            az webapp config appsettings set \
              --name ${{ vars.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --settings \
                PORT=8000 \
                WORKFLOW_ACTION_BACKEND=foundry \
                GATEWAY_CORS_ORIGINS="${{ vars.CORS_ORIGINS }}" \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                KEY_VAULT_NAME=${{ vars.KEY_VAULT_NAME }}

  build-pages:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build Vite app
        env:
          VITE_BASE: /Agentic-SDK/
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
