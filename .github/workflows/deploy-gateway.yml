name: Deploy Gateway + GitHub Pages

# 所有部署參數來自 GitHub Repository Variables，設定清單見 .github/azure-deploy-config.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # OIDC 登入 Azure 必要

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure 登入（OIDC，無 secret）
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 產生 requirements.txt（鎖定版本）
        run: |
          pip install uv --quiet
          uv pip compile pyproject.toml -o requirements.txt

      - name: 部署至 Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: 設定 App Service 啟動指令與基礎參數
        # 敏感資料（Foundry key/endpoint）由 App Service Managed Identity
        # 從 Key Vault（agentic-sdk-model-registry）在 runtime 讀取。
        # 此步驟只設定非敏感的執行環境參數。
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --name ${{ vars.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --startup-file "python -m agentic_sdk.gateway"

            az webapp config appsettings set \
              --name ${{ vars.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --settings \
                PORT=8000 \
                WORKFLOW_ACTION_BACKEND=foundry \
                GATEWAY_CORS_ORIGINS="${{ vars.CORS_ORIGINS }}" \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                KEY_VAULT_NAME=agentic-sdk-model-registry

  build-pages:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build Vite app
        env:
          VITE_BASE: /Agentic-SDK/
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
