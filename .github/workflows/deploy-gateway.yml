name: Deploy Gateway + GitHub Pages

# ── 靜態部署參數：與 .github/azure-deploy-config.yml 保持同步 ──
env:
  AZURE_WEBAPP_NAME: agentic-sdk-playground
  AZURE_RESOURCE_GROUP: agentic-sdk
  AZURE_SUBSCRIPTION: eosl-r3-aihub
  GATEWAY_URL: https://agentic-sdk-playground.azurewebsites.net
  CORS_ORIGINS: "https://r300-ai.github.io,http://localhost:5173"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure 登入
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 產生 requirements.txt（鎖定版本）
        run: |
          pip install uv --quiet
          uv pip compile pyproject.toml -o requirements.txt

      - name: 部署至 Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: 設定 App Service 環境變數與啟動指令
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --subscription ${{ env.AZURE_SUBSCRIPTION }} \
              --startup-file "python -m agentic_sdk.gateway"

            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --subscription ${{ env.AZURE_SUBSCRIPTION }} \
              --settings \
                PORT=8000 \
                AZURE_FOUNDRY_ENDPOINT="${{ secrets.AZURE_FOUNDRY_ENDPOINT }}" \
                AZURE_FOUNDRY_API_KEY="${{ secrets.AZURE_FOUNDRY_API_KEY }}" \
                AZURE_FOUNDRY_DEPLOYMENT="${{ secrets.AZURE_FOUNDRY_DEPLOYMENT }}" \
                WORKFLOW_ACTION_BACKEND=foundry \
                GATEWAY_CORS_ORIGINS="${{ env.CORS_ORIGINS }}" \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true

  build-pages:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build Vite app
        env:
          VITE_BASE: /Agentic-SDK/
          VITE_GATEWAY_URL: ${{ env.GATEWAY_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
