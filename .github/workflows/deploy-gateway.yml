name: Deploy Gateway + GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "agentic_sdk/**"
      - "pyproject.toml"
      - "Procfile"
      - "demo/**"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    outputs:
      gateway_url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: 驗證 GCP 身分
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source)
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          FOUNDRY_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          FOUNDRY_DEPLOYMENT: ${{ secrets.AZURE_FOUNDRY_DEPLOYMENT }}
        run: |
          CORS='["https://R300-AI.github.io","http://localhost:5173"]'
          gcloud run deploy agentic-sdk-gateway \
            --source . \
            --region asia-east1 \
            --project eternal-insight-423516-m3 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "^|^AZURE_FOUNDRY_ENDPOINT=${FOUNDRY_ENDPOINT}|AZURE_FOUNDRY_API_KEY=${FOUNDRY_KEY}|AZURE_FOUNDRY_DEPLOYMENT=${FOUNDRY_DEPLOYMENT}|GATEWAY_CORS_ORIGINS=${CORS}" \
            --quiet

      - name: Get service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe agentic-sdk-gateway \
            --region asia-east1 \
            --project eternal-insight-423516-m3 \
            --format 'value(status.url)')
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "===== GATEWAY URL: $URL ====="

  build-pages:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build Vite app
        env:
          VITE_BASE: /Agentic-SDK/
          VITE_GATEWAY_URL: ${{ needs.deploy-gateway.outputs.gateway_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
