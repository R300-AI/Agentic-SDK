name: CI

on:
  push:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'tests/**'
      - 'demo/**'
      - 'demo_old/**'
      - 'examples_old/**'
      - 'docs/github_cicd_workflow.md'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'tests/**'
      - 'demo/**'
      - 'demo_old/**'
      - 'examples_old/**'
      - 'docs/github_cicd_workflow.md'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit:
    name: Python unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Canonical config contract tests
        run: python -m unittest discover -s tests -p "test_workflow_canonical_config.py"

      - name: Documented module unit tests
        run: python -m unittest discover -s tests -p "test_unit_*.py"

  python-integration:
    name: Python integration
    runs-on: ubuntu-latest
    needs: python-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Documented workflow integration tests
        run: python -m unittest discover -s tests -p "test_integration_*.py"

  python-smoke:
    name: Python smoke
    runs-on: ubuntu-latest
    needs: python-integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: README workflow smoke tests
        run: python -m unittest discover -s tests -p "test_smoke_*.py"

  check-typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_old
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Run vitest (nodeAnimator FIFO contract)
        run: npm test
