name: CI

on:
  push:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'tests/**'
      - 'demo/**'
      - 'playground/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'tests/**'
      - 'demo/**'
      - 'playground/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PLAYGROUND_TEST_MODE: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify semantic ingestion conversion dependencies
        run: |
          python - <<'PY'
          import importlib

          required_modules = (
              "markitdown",
              "mammoth",
              "openpyxl",
              "pandas",
              "pdfminer.high_level",
              "pptx",
              "xlrd",
          )
          for module in required_modules:
              importlib.import_module(module)
          PY

      - name: Run tests
        run: python -m pytest -q
