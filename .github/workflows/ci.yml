name: CI

on:
  push:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'demo_old/**'
      - 'examples_old/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agentic_sdk/**'
      - 'demo_old/**'
      - 'examples_old/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

jobs:
  check-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_old
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Run vitest (nodeAnimator FIFO contract)
        run: npm test
