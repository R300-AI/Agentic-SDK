name: Deploy Playground to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "agentic_sdk/**"
      - "playground/**"
      - ".env"
      - "requirements.txt"
      - ".github/workflows/deploy-playground.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-playground
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy FastAPI Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Azure login by OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure App Service resources
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            RG="${{ vars.AZURE_RESOURCE_GROUP }}"
            WEBAPP="${{ vars.AZURE_WEBAPP_NAME }}"
            KV="${{ vars.KEY_VAULT_NAME }}"
            REGION="${{ vars.AZURE_REGION }}"
            PLAN="${WEBAPP}-plan"

            if ! az group show --name "$RG" --output none 2>/dev/null; then
              az group create --name "$RG" --location "$REGION" --output none
            fi

            if ! az appservice plan show --name "$PLAN" --resource-group "$RG" --output none 2>/dev/null; then
              az appservice plan create \
                --name "$PLAN" \
                --resource-group "$RG" \
                --sku B2 \
                --is-linux \
                --location "$REGION" \
                --output none
            fi

            if ! az webapp show --name "$WEBAPP" --resource-group "$RG" --output none 2>/dev/null; then
              az webapp create \
                --name "$WEBAPP" \
                --resource-group "$RG" \
                --plan "$PLAN" \
                --runtime "PYTHON:3.12" \
                --output none
            fi

            PRINCIPAL_ID=$(az webapp identity show \
              --name "$WEBAPP" \
              --resource-group "$RG" \
              --query principalId \
              -o tsv 2>/dev/null || true)
            if [ -z "$PRINCIPAL_ID" ] || [ "$PRINCIPAL_ID" = "null" ]; then
              az webapp identity assign \
                --name "$WEBAPP" \
                --resource-group "$RG" \
                --output none
              PRINCIPAL_ID=$(az webapp identity show \
                --name "$WEBAPP" \
                --resource-group "$RG" \
                --query principalId \
                -o tsv)
            fi

            if ! az keyvault show --name "$KV" --output none 2>/dev/null; then
              az keyvault create \
                --name "$KV" \
                --resource-group "$RG" \
                --location "$REGION" \
                --sku standard \
                --enable-rbac-authorization true \
                --output none
            fi

            KV_ID=$(az keyvault show --name "$KV" --query id -o tsv)
            EXISTING_ASSIGNMENT=$(az role assignment list \
              --role "Key Vault Secrets User" \
              --assignee "$PRINCIPAL_ID" \
              --scope "$KV_ID" \
              --query "[0].id" \
              -o tsv)
            if [ -z "$EXISTING_ASSIGNMENT" ]; then
              az role assignment create \
                --role "Key Vault Secrets User" \
                --assignee-object-id "$PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --scope "$KV_ID" \
                --output none
            fi

      - name: Configure App Service runtime
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            STARTUP_COMMAND='python -m playground.main'
            CURRENT_STARTUP=$(az webapp show \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "siteConfig.appCommandLine" \
              -o tsv)
            CURRENT_SECRET=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='PLAYGROUND_SECRET_KEY'].value | [0]" \
              -o tsv)
            if [ -z "$CURRENT_SECRET" ]; then
              CURRENT_SECRET=$(openssl rand -hex 32)
            fi

            if [ "$CURRENT_STARTUP" != "$STARTUP_COMMAND" ]; then
              az webapp config set \
                --name "${{ vars.AZURE_WEBAPP_NAME }}" \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --startup-file "$STARTUP_COMMAND" \
                --output none
            fi

            CURRENT_PORT=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='PORT'].value | [0]" \
              -o tsv)
            CURRENT_WEBSITES_PORT=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='WEBSITES_PORT'].value | [0]" \
              -o tsv)
            CURRENT_SCM_BUILD=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" \
              -o tsv)
            CURRENT_ORYX_BUILD=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='ENABLE_ORYX_BUILD'].value | [0]" \
              -o tsv)
            CURRENT_PYTHONPATH=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='PYTHONPATH'].value | [0]" \
              -o tsv)
            CURRENT_KEY_VAULT=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='KEY_VAULT_NAME'].value | [0]" \
              -o tsv)
            CURRENT_AI_HUB_BASE_URL=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='AI_HUB_BASE_URL'].value | [0]" \
              -o tsv)
            CURRENT_AI_HUB_PLAYGROUND_ORIGIN=$(az webapp config appsettings list \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='AI_HUB_PLAYGROUND_ORIGIN'].value | [0]" \
              -o tsv)

            DESIRED_PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages:/home/site/wwwroot
            DESIRED_AI_HUB_BASE_URL=$(sed -n 's/^AI_HUB_BASE_URL=//p' .env | tail -n 1 | tr -d '"' | tr -d "'")
            DESIRED_AI_HUB_PLAYGROUND_ORIGIN="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
            SHOULD_UPDATE_SETTINGS=false

            if [ "$CURRENT_PORT" != "8000" ] || \
               [ "$CURRENT_WEBSITES_PORT" != "8000" ] || \
               [ "$CURRENT_SCM_BUILD" != "false" ] || \
               [ "$CURRENT_ORYX_BUILD" != "false" ] || \
               [ "$CURRENT_PYTHONPATH" != "$DESIRED_PYTHONPATH" ] || \
               [ "$CURRENT_KEY_VAULT" != "${{ vars.KEY_VAULT_NAME }}" ] || \
               [ "$CURRENT_AI_HUB_PLAYGROUND_ORIGIN" != "$DESIRED_AI_HUB_PLAYGROUND_ORIGIN" ]; then
              SHOULD_UPDATE_SETTINGS=true
            fi
            if [ -n "$DESIRED_AI_HUB_BASE_URL" ] && [ "$CURRENT_AI_HUB_BASE_URL" != "$DESIRED_AI_HUB_BASE_URL" ]; then
              SHOULD_UPDATE_SETTINGS=true
            fi

            if [ "$SHOULD_UPDATE_SETTINGS" = "true" ]; then
              APP_SETTINGS=(
                "PORT=8000"
                "WEBSITES_PORT=8000"
                "SCM_DO_BUILD_DURING_DEPLOYMENT=false"
                "ENABLE_ORYX_BUILD=false"
                "PYTHONPATH=$DESIRED_PYTHONPATH"
                "KEY_VAULT_NAME=${{ vars.KEY_VAULT_NAME }}"
                "AI_HUB_PLAYGROUND_ORIGIN=$DESIRED_AI_HUB_PLAYGROUND_ORIGIN"
                "PLAYGROUND_SECRET_KEY=$CURRENT_SECRET"
              )
              if [ -n "$DESIRED_AI_HUB_BASE_URL" ]; then
                APP_SETTINGS+=("AI_HUB_BASE_URL=$DESIRED_AI_HUB_BASE_URL")
              fi
              az webapp config appsettings set \
                --name "${{ vars.AZURE_WEBAPP_NAME }}" \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --settings "${APP_SETTINGS[@]}" \
                --output none
            fi

      - name: Install Python dependencies into package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target .python_packages/lib/site-packages -r requirements.txt

      - name: Verify FastAPI Playground package
        env:
          PYTHONPATH: .python_packages/lib/site-packages:.
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from playground.main import app

          client = TestClient(app)
          health = client.get('/healthz')
          assert health.status_code == 200, health.text
          assert health.json() == {'status': 'ok'}

          entry = client.get('/playground')
          assert entry.status_code == 200, entry.text[:500]
          assert 'AI Hub Agent' in entry.text

          builder = client.get('/playground/builder')
          assert builder.status_code == 200, builder.text[:500]
          assert '回覆風格與規範' in builder.text
          assert '可互動元件 API' in builder.text
          assert '互動面板進階配置' not in builder.text
          PY

      - name: Create deployment package
        run: |
          zip -r deploy.zip \
            agentic_sdk/ \
            playground/ \
            .python_packages/ \
            .env \
            requirements.txt \
            -x "*.pyc" -x "*/__pycache__/*" -x "playground/visual-audit/*"

      - name: Deploy package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy.zip
          clean: true

      - name: Restart App Service after package deploy
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp restart \
              --name "${{ vars.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --output none

      - name: Verify deployed Playground
        run: |
          set -euo pipefail

          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/playground"
          AGENTS_URL="${URL}/agents"
          BUILDER_URL="${URL}/builder"
          RUNNER_JS_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/static/js/runner/runner-page.js"
          RESULT_SURFACE_JS_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/static/js/runner/result-surface.js"
          CSS_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/static/css/app.css"

          contains() {
            local file="$1"
            local needle="$2"
            if ! grep -q "$needle" "$file"; then
              CHECK_FAILURE="Expected '$needle' in $file"
              return 1
            fi
          }

          not_contains() {
            local file="$1"
            local needle="$2"
            if grep -q "$needle" "$file"; then
              CHECK_FAILURE="Did not expect '$needle' in $file"
              return 1
            fi
          }

          verify_once() {
            CHECK_FAILURE=""
            curl --fail --silent --show-error --location "$URL" | grep -q "AI Hub Agent" || { CHECK_FAILURE="Playground entry is not ready"; return 1; }
            curl --fail --silent --show-error --location "$AGENTS_URL" | grep -q "AI Hub Agent" || { CHECK_FAILURE="Agents page is not ready"; return 1; }

            curl --fail --silent --show-error --location "$BUILDER_URL" --output builder.html || { CHECK_FAILURE="Builder page request failed"; return 1; }
            contains builder.html "builder-step-memory_type" || return 1
            contains builder.html "builder-step-input_type" || return 1
            contains builder.html "builder-step-retrieve_policy" || return 1
            contains builder.html "builder-step-output_format" || return 1
            contains builder.html "builder-step-readiness" || return 1
            contains builder.html "純文字回覆" || return 1
            contains builder.html "可互動元件" || return 1
            contains builder.html "回覆風格與規範" || return 1
            contains builder.html "可互動元件 API" || return 1
            contains builder.html "功能說明" || return 1
            contains builder.html "api-endpoint-row" || return 1
            contains builder.html "api-method-field" || return 1
            not_contains builder.html "builder-step-template" || return 1
            not_contains builder.html "builder-step-reflect" || return 1
            not_contains builder.html "可互動元件 API 契約" || return 1
            not_contains builder.html "回覆指令" || return 1
            not_contains builder.html "互動面板進階配置" || return 1

            curl --fail --silent --show-error --location "$RUNNER_JS_URL" --output runner-page.js || { CHECK_FAILURE="Runner page JS request failed"; return 1; }
            contains runner-page.js "tool_call_submission" || return 1
            contains runner-page.js "runner:tool-call-submit" || return 1

            curl --fail --silent --show-error --location "$RESULT_SURFACE_JS_URL" --output result-surface.js || { CHECK_FAILURE="Result surface JS request failed"; return 1; }
            contains result-surface.js "runner:tool-call-submit" || return 1
            contains result-surface.js "tool-call-panel" || return 1

            curl --fail --silent --show-error --location "$CSS_URL" --output app.css || { CHECK_FAILURE="CSS request failed"; return 1; }
            contains app.css "api-contract-editor" || return 1

            COOKIE_JAR="$(mktemp)"
            curl --fail --silent --show-error --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
              --request POST "$URL/start/anonymous" >/dev/null || { CHECK_FAILURE="Anonymous session start failed"; return 1; }

            printf '{"step":"output_format","choice":"interactive"}' > builder-choice.json
            curl --fail --silent --show-error --location --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary @builder-choice.json \
              "$URL/builder/state" >/dev/null || { CHECK_FAILURE="Builder output format update failed"; return 1; }

            printf '%s' '{"step":"action","value":{"response_instruction":"設定 Agent 的角色、語氣、品牌話術、回答順序與不能說的內容。","interaction_trigger":"說明這個元件要協助使用者完成哪項流程、需要取得哪些必要資訊，以及資料齊全後如何交給後續處理。","api_method":"POST","api_url":"https://api.example.com/resource","component_fields":"id = 識別碼\nquantity = 數字：數量\napproved = 是否確認","api_body_template":"{\"id\":\"{{id}}\",\"quantity\":\"{{quantity}}\",\"approved\":\"{{approved}}\"}","missing_info_rule":"缺少必要欄位時，先詢問使用者補齊後再送出。"}}' > builder-action.json
            curl --fail --silent --show-error --location --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary @builder-action.json \
              "$URL/builder/state" >/dev/null || { CHECK_FAILURE="Builder action update failed"; return 1; }

            curl --fail --silent --show-error --location --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
              --request POST "$URL/source/export" --output exported-source.py || { CHECK_FAILURE="Source export failed"; return 1; }
            contains exported-source.py "ToolCallAction(" || return 1
            contains exported-source.py "tools=\[" || return 1
            contains exported-source.py "submit_api_1" || return 1
            contains exported-source.py "設定 Agent 的角色、語氣、品牌話術、回答順序與不能說的內容。" || return 1
            contains exported-source.py "說明這個元件要協助使用者完成哪項流程" || return 1
            contains exported-source.py "https://api.example.com/resource" || return 1
            contains exported-source.py "quantity" || return 1
            contains exported-source.py "approved" || return 1
            not_contains exported-source.py "回覆風格與規範：" || return 1
            not_contains exported-source.py "互動元件觸發條件：" || return 1
            not_contains exported-source.py "API 提交設定：" || return 1
            not_contains exported-source.py "StructuredAction" || return 1
          }

          for attempt in {1..30}; do
            if verify_once; then
              echo "Playground is live at $URL"
              exit 0
            fi

            echo "Waiting for Playground startup: attempt $attempt/30 (${CHECK_FAILURE:-unknown check failed})"
            sleep 10
          done

          echo "::error::Playground did not become healthy at $URL (${CHECK_FAILURE:-unknown check failed})"
          exit 1
