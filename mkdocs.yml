site_name: Agentic SDK 文件網站
site_description: Agentic SDK 開發者文件站
repo_url: https://github.com/R300-AI/Agentic-SDK
repo_name: R300-AI/Agentic-SDK
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
  font:
    text: Noto Sans Traditional Chinese
    code: JetBrains Mono

nav:
  - 首頁: index.md
  - 工作流程:
    - workflow/index.md
    - 記憶類型: workflow/memory-types.md
  - 模組家族:
    - modules/index.md
    - 輸入理解: modules/perceive-modules.md
    - 參考資料: modules/retrieve-modules.md
    - 規劃與推理: modules/plan-modules.md
    - 回覆與動作: modules/action-modules.md
    - 安全控制: modules/reflect-modules.md
  - Notebook 教材:
    - 教材總覽: tutorials/index.md
    - 做出一條可以跑的工作流程: tutorials/build-and-run-a-workflow.md
    - 看懂 Agent 每一步怎麼跑: tutorials/watch-a-workflow-run.md
    - 讓 Agent 接得住前後文: tutorials/multi-turn-conversation.md
    - 讓 Agent 先查資料再回答: tutorials/search-documents-and-answer.md
    - 讓 Agent 判斷什麼時候要叫工具: tutorials/call-tools-from-a-workflow.md
    - 把遊樂場做好的 Agent 帶回程式碼: tutorials/from-playground-to-code.md
  - Use Case 實施例:
    - use-cases/index.md
    - LaNew 售鞋顧問: use-cases/lanew-footwear-advisor.md
    - BCI 射箭教練: use-cases/bci-archery-coach.md
    - ICOPE 六力評估助手: use-cases/icope-six-capacity-assistant.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - en

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/R300-AI/Agentic-SDK

copyright: Copyright &copy; Agentic SDK maintainers