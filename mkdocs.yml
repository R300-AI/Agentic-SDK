site_name: Agentic SDK 文件網站
site_description: Agentic SDK 開發者文件站
repo_url: https://github.com/R300-AI/Agentic-SDK
repo_name: R300-AI/Agentic-SDK
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
  font:
    text: Noto Sans Traditional Chinese
    code: JetBrains Mono

nav:
  - 首頁: index.md
  - 工作流程:
    - workflow/index.md
    - 記憶類型: workflow/memory-types.md
  - 模組家族:
    - modules/index.md
    - 輸入理解: modules/perceive-modules.md
    - 參考資料: modules/retrieve-modules.md
    - 規劃與推理: modules/plan-modules.md
    - 技能包: modules/skill-packages.md
    - 回覆與動作: modules/action-modules.md
    - 安全控制: modules/reflect-modules.md
  - Notebook 教材:
    - 教材總覽: tutorials/index.md
    - 跑出第一條 Agentic SDK Workflow: tutorials/getting-started.md
    - 做出一條可以跑的工作流程: tutorials/build-and-run-a-workflow.md
    - 讓畫面知道 Agent 跑到哪一步: tutorials/watch-a-workflow-run.md
    - 設定工作流程的畫面事件: tutorials/configure-workflow-events.md
    - 讓 Agent 接得住前後文: tutorials/multi-turn-conversation.md
    - 讓 Agent 檢查回答有沒有依據: tutorials/search-documents-and-answer.md
    - 讓 Agent 判斷什麼時候要叫工具: tutorials/call-tools-from-a-workflow.md
    - 五大模組的共同寫法: tutorials/module-writing-basics.md
    - 用講的跟 Workflow 對話: tutorials/talk-to-a-workflow.md
  - 設計決策:
    - 語音在工作流裡的位置: adr/0001-where-voice-lives.md
    - 一輪對話記下什麼: adr/0002-what-a-turn-records.md
    - 語音端點怎麼定義: adr/0003-how-a-voice-endpoint-is-defined.md
  - 加入貢獻: contributing/index.md
  - 技術 Blog:
    - blog/index.md
    - Reflect - Letta: blog/reflect-letta.md
    - Action - Fara: blog/action-fara.md
    - Action - MatrAIx: blog/action-matraix.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - en

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/R300-AI/Agentic-SDK

copyright: Copyright &copy; Agentic SDK maintainers