site_name: Agentic SDK 文件網站
site_description: Agentic SDK 開發者文件站
repo_url: https://github.com/R300-AI/Agentic-SDK
repo_name: R300-AI/Agentic-SDK
docs_dir: docs-site
site_dir: site

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
  font:
    text: Noto Sans Traditional Chinese
    code: JetBrains Mono

nav:
  - 首頁: index.md
  - Workflow:
    - 總覽: workflow-overview.md
    - 引擎選項: workflow-engines.md
  - Module Family:
    - modules/index.md
    - Perceive: modules/perceive-modules.md
    - Plan: modules/plan-modules.md
    - Retrieve: modules/retrieve-modules.md
    - Action: modules/action-modules.md
    - Reflect: modules/reflect-modules.md
  - Use Case:
    - use-cases/index.md
    - LaNew 售鞋顧問: use-cases/lanew-footwear-advisor.md
    - BCI 射箭教練: use-cases/bci-archery-coach.md
    - ICOPE 六力評估助手: use-cases/icope-six-capacity-assistant.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - en

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/R300-AI/Agentic-SDK

copyright: Copyright &copy; Agentic SDK maintainers